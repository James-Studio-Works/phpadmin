<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paste — phpadmin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Highlight.js for syntax -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body { background: #0f172a; }
    pre { margin: 0; }
    code.hljs { padding: 1.25rem 1.5rem; background: transparent !important; font-size: 0.875rem; line-height: 1.6; }
    .line-numbers { counter-reset: line; }
  </style>
</head>
<body class="min-h-screen text-slate-100 font-sans">
  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 group">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center font-bold text-white text-sm shadow-lg shadow-sky-500/20">
          PA
        </div>
        <span class="text-xl font-semibold tracking-tight group-hover:text-sky-400 transition">phpadmin</span>
      </a>
      <nav class="flex items-center gap-3 text-sm">
        <button onclick="copyLink()" id="copyLinkBtn" class="text-slate-400 hover:text-white transition px-3 py-1.5 rounded-lg hover:bg-slate-800">
          Copy Link
        </button>
        <button onclick="copyContent()" id="copyBtn" class="text-slate-400 hover:text-white transition px-3 py-1.5 rounded-lg hover:bg-slate-800">
          Copy Content
        </button>
        <a href="/" class="bg-sky-600 hover:bg-sky-500 text-white font-medium px-4 py-1.5 rounded-lg transition">
          New Paste
        </a>
      </nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <div id="loading" class="text-center py-20 text-slate-400">
      <div class="inline-block w-8 h-8 border-2 border-sky-500 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p>Loading paste...</p>
    </div>

    <div id="error" class="hidden text-center py-20">
      <div class="text-6xl mb-4">404</div>
      <h1 class="text-2xl font-semibold mb-2">Paste not found</h1>
      <p class="text-slate-400 mb-6">This paste may have expired or never existed.</p>
      <a href="/" class="inline-block bg-sky-600 hover:bg-sky-500 text-white px-5 py-2.5 rounded-lg transition">Create a new one</a>
    </div>

    <div id="paste" class="hidden">
      <!-- Meta -->
      <div class="mb-6">
        <h1 id="title" class="text-2xl sm:text-3xl font-bold mb-3 text-slate-50"></h1>
        <div class="flex flex-wrap items-center gap-3 text-sm text-slate-400">
          <span id="language" class="px-2.5 py-1 rounded-full bg-slate-800 text-sky-400 font-medium"></span>
          <span id="date"></span>
          <span>·</span>
          <span id="views"></span>
        </div>
      </div>

      <!-- Content -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
        <div class="flex items-center justify-between px-4 py-2.5 border-b border-slate-800 bg-slate-900/80">
          <span class="text-xs text-slate-500 font-mono" id="filename">paste.txt</span>
          <button onclick="copyContent()" class="text-xs text-slate-400 hover:text-sky-400 transition flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            Copy
          </button>
        </div>
        <pre class="overflow-x-auto"><code id="code" class="hljs language-text"></code></pre>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800 mt-16 py-8 text-center text-slate-500 text-sm">
    <p>phpadmin · <a href="/" class="text-sky-400 hover:underline">Create new paste</a></p>
  </footer>

  <script>
    const id = window.location.pathname.split('/').pop();

    async function loadPaste() {
      try {
        const res = await fetch(`/api/pastes/${id}`);
        if (!res.ok) {
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('error').classList.remove('hidden');
          document.title = 'Not Found — phpadmin';
          return;
        }

        const paste = await res.json();

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('paste').classList.remove('hidden');

        // Title
        const title = paste.title || 'Untitled Paste';
        document.getElementById('title').textContent = title;
        document.title = `${title} — phpadmin`;

        // Meta
        document.getElementById('language').textContent = paste.language || 'text';
        document.getElementById('date').textContent = new Date(paste.createdAt).toLocaleString();
        document.getElementById('views').textContent = `${paste.views || 0} view${(paste.views || 0) !== 1 ? 's' : ''}`;

        // Code
        const codeEl = document.getElementById('code');
        codeEl.textContent = paste.content;
        codeEl.className = `hljs language-${paste.language || 'text'}`;

        // Filename hint
        const extMap = {
          javascript: 'js', typescript: 'ts', python: 'py', php: 'php',
          html: 'html', css: 'css', json: 'json', sql: 'sql', bash: 'sh',
          markdown: 'md', java: 'java', go: 'go', rust: 'rs', c: 'c', text: 'txt'
        };
        document.getElementById('filename').textContent = `paste.${extMap[paste.language] || 'txt'}`;

        // Highlight
        hljs.highlightElement(codeEl);

        // Store for copy
        window.__pasteContent = paste.content;
      } catch (err) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
      }
    }

    function copyContent() {
      const text = window.__pasteContent || '';
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = original, 1500);
      });
    }

    function copyLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        const btn = document.getElementById('copyLinkBtn');
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = original, 1500);
      });
    }

    loadPaste();
  </script>
</body>
</html>
